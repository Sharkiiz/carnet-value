<main id="view"></main>

<div id="tipbox" role="dialog" aria-live="polite" aria-labelledby="tipTitle" hidden><button class="close" id="tipClose" aria-label="Fermer l’explication">×</button><h3 id="tipTitle"></h3><p id="tipText"></p><p class="ex" id="tipEx"></p></div>

  <button data-tab="calc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg>Valeur</button>

  <button data-tab="sim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16M7 15l4-4 3 3 5-6"/></svg>Simulateur</button>

<script>
"use strict";
const S = { tab:"screener", stocks:{}, positions:{}, history:{}, simT:null, simP:{mos:30,r:9,sell:"value"}, plan:{amount:200,lines:5,fee:1,frac:false}, sel:null, db:null, sample:null, ai:{},
  f:{ perMax:"", roeMin:"", debtMax:"", scoreMin:"", sector:"", sort:"score" } };

const FIELDS = [
  ["name","Nom","text"],["sector","Secteur","text"],["price","Cours (€)","num"],["eps","BPA (€)","num"],
  ["fcfps","FCF par action (€)","num"],["bvps","Valeur comptable/action (€)","num"],["dps","Dividende/action (€)","num"],
  ["roe","ROE (%)","num"],["roic","ROIC (%)","num"],["opMargin","Marge opérationnelle (%)","num"],
  ["growth5y","Croissance BPA 5 ans (%/an)","num"],["netDebtEbitda","Dette nette / EBITDA","num"],
  ["moat","Moat (0 à 5)","num"],["intrinsic","Valeur intrinsèque (€)","num"],["notes","Notes","text"],["updatedAt","Données au","text"]
];

const fmt = (v,d=1)=> v==null||isNaN(v) ? "—" : Number(v).toLocaleString("fr-FR",{maximumFractionDigits:d,minimumFractionDigits:0});
const eur = v => v==null||isNaN(v) ? "—" : Number(v).toLocaleString("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:2});
const num = v => (v===""||v==null||isNaN(Number(v))) ? null : Number(v);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* Méthode Buffett : valeur intrinsèque par DCF, achat avec 30 % de marge de sécurité */
const MOS = 30, R = 9, GT = 2.5;
function dcf(base,g1,g2,gt,r){
  if(!(base>0) || r<=gt) return null;
  let cf=base, pv=0; for(let y=1;y<=10;y++){cf*=1+(y<=5?g1:g2)/100; pv+=cf/Math.pow(1+r/100,y);}
  return pv + cf*(1+gt/100)/((r-gt)/100)/Math.pow(1+r/100,10);
}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function autoIV(s){ const base=s.fcfps ?? s.eps; const g=clamp(s.growth5y ?? 6,0,12); return dcf(base,g,g/2,GT,R); }
function ivOf(s){ if(s.intrinsic) return {iv:s.intrinsic,auto:false}; const a=autoIV(s); return {iv:a,auto:a!=null}; }
function derived(s){
  const per = s.price && s.eps>0 ? s.price/s.eps : null;
  const fcfY = s.price && s.fcfps!=null ? s.fcfps/s.price*100 : null;
  const dy = s.price && s.dps!=null ? s.dps/s.price*100 : null;
  const graham = s.eps>0 && s.bvps>0 ? Math.sqrt(22.5*s.eps*s.bvps) : null;
  const {iv,auto} = ivOf(s);
  const mos = iv && s.price ? (1 - s.price/iv)*100 : null;
  const buy = iv ? iv*(1-MOS/100) : null;
  return {per,fcfY,dy,graham,iv,ivAuto:auto,mos,buy};
}
function scoreOf(s){
  const d = derived(s); const parts = [];
  let q=0, qm=0; const r = s.roic ?? s.roe;
  if(r!=null){qm+=15; q+= r>=20?15:r>=15?11:r>=10?5:0;}
  if(s.opMargin!=null){qm+=12; q+= s.opMargin>=20?12:s.opMargin>=12?7:s.opMargin>=6?3:0;}
  if(s.growth5y!=null){qm+=8; q+= s.growth5y>=8?8:s.growth5y>=4?5:s.growth5y>=0?2:0;}
  parts.push(["Qualité",q,qm,35]);
  let m=0,mm=0; if(s.moat!=null){mm=25; m=clamp(s.moat,0,5)*5;}
  parts.push(["Moat",m,mm,25]);
  let b=0,bm=0;
  if(s.netDebtEbitda!=null){bm=15; const x=s.netDebtEbitda; b= x<=0?15:x<=1?12:x<=2?9:x<=3?4:0;}
  parts.push(["Solidité",b,bm,15]);
  let v=0, vm=0;
  if(d.mos!=null){vm=25; v= d.mos>=MOS?25:d.mos>=15?15:d.mos>=0?8:0;}
  else if(d.per!=null){vm=25; v= d.per<=15?20:d.per<=20?12:d.per<=25?6:0;}
  parts.push(["Prix",v,vm,25]);
  const got = parts.reduce((a,p)=>a+p[1],0), max = parts.reduce((a,p)=>a+p[2],0);
  return { score: max? Math.round(got/max*100) : null, coverage: Math.round(max), parts };
}
/* Signal Buffett : une bonne entreprise (moat, rentabilité, dette) achetée avec la marge de sécurité */
function signalOf(s){
  if(/Banque|Assurance|Immobilier/i.test(s.sector||"")) return {k:"na",l:"Méthode inadaptée"};
  const d=derived(s); const r=s.roic??s.roe;
  const quality = (s.moat==null||s.moat>=4) && (r==null||r>=15) && (s.netDebtEbitda==null||s.netDebtEbitda<=2.5);
  if(!quality) return {k:"out",l:"Hors critères"};
  if(d.mos==null) return {k:"na",l:"Données insuffisantes"};
  if(d.mos>=MOS) return {k:"buy",l:"Achat"};
  return {k:"wait",l:"Trop cher"};
}
const sigHtml = s => { const g=signalOf(s); return `<span class="sig sig-${g.k}">${g.l}</span>`; };
const cls = sc => sc==null?"s-mid":sc>=70?"s-hi":sc>=50?"s-mid":"s-lo";

/* ---------- Bulles d’explication ---------- */
const GLOSS = [
  [/Valeur intrinsèque|Valeur est\./,"Valeur intrinsèque","Ce que vaut réellement l’entreprise, d’après l’argent qu’elle va gagner dans le futur, indépendamment du cours de Bourse. Ici, elle est calculée par DCF. « Auto » signifie qu’elle est estimée avec des hypothèses par défaut.","Si une action vaut 100 € et cote 70 €, elle est 30 % moins chère que sa valeur."],
  [/Prix d’achat|Prix achat|Acheter sous/,"Prix d’achat Buffett","Le cours sous lequel la méthode conseille d’acheter : la valeur intrinsèque moins la marge de sécurité (30 %).","Valeur 100 € → on n’achète qu’en dessous de 70 €."],
  [/Marge de sécurité|^Marge \(%\)/,"Marge de sécurité","L’écart entre la valeur estimée et le cours. C’est le coussin qui protège si tes calculs sont trop optimistes. Buffett et Graham exigent une marge importante avant d’acheter.","Valeur 100 €, cours 70 € : marge de 30 %."],
  [/Marge opérationnelle|Marge op\./,"Marge opérationnelle","La part du chiffre d’affaires qui reste en bénéfice après les coûts de l’activité (avant intérêts et impôts). Une marge élevée et stable signale souvent un avantage concurrentiel.","20 % : sur 100 € de ventes, il reste 20 € de bénéfice d’exploitation."],
  [/Flux de départ/,"Flux de départ","L’argent gagné par action aujourd’hui, point de départ du calcul. On prend le free cash-flow par action s’il est connu, sinon le BPA.",""],
  [/FCF/,"Free cash-flow (FCF)","L’argent réellement disponible après avoir payé les dépenses et les investissements. Buffett l’appelle les « owner earnings » : ce qu’un propriétaire pourrait retirer de l’entreprise. Le rendement FCF = FCF par action / cours.","Rendement FCF de 5 % : pour 100 € investis, l’entreprise génère 5 € de cash par an."],
  [/Rendement dividende|Rdt div|Dividende/,"Dividende et rendement","Le dividende est la part du bénéfice versée chaque année aux actionnaires. Le rendement = dividende / cours.","Dividende 3 € pour un cours de 100 € : rendement de 3 %."],
  [/PER/,"PER (Price Earning Ratio)","Le cours divisé par le bénéfice par action. Il indique combien d’années de bénéfices tu paies. Plus il est bas, moins l’action est chère, mais une entreprise de qualité mérite souvent un PER plus élevé.","Cours 200 €, BPA 10 € : PER de 20. Graham visait moins de 15."],
  [/BPA/,"BPA (bénéfice par action)","Le bénéfice net de l’entreprise divisé par le nombre d’actions : la part du bénéfice qui revient à une action.","Bénéfice 1 Md€, 100 millions d’actions : BPA de 10 €."],
  [/ROIC|ROE/,"ROE et ROIC","La rentabilité de l’argent investi. Le ROE mesure le bénéfice par rapport aux capitaux propres ; le ROIC, par rapport à tout le capital investi (dette comprise), ce qui est plus fiable. Buffett cherche plus de 15 % durablement.","ROIC 20 % : chaque 100 € investis rapportent 20 € par an."],
  [/Dette/,"Dette nette / EBITDA","Le nombre d’années de résultat d’exploitation (avant amortissements) nécessaires pour rembourser la dette. Un chiffre négatif signifie plus de trésorerie que de dette.","Moins de 2 : confortable. Plus de 3 : prudence."],
  [/Nombre de Graham/,"Nombre de Graham","Un prix maximum rapide imaginé par Benjamin Graham, le maître de Buffett : racine carrée de (22,5 × BPA × valeur comptable par action). Il convient surtout aux entreprises classiques, peu aux entreprises à marques fortes.",""],
  [/Formule de Graham/,"Formule de Graham","Une estimation de la valeur selon Graham, qui tient compte de la croissance et des taux d’intérêt. Indicative seulement, pour comparer avec le DCF.",""],
  [/Valeur comptable/,"Valeur comptable par action","Ce que possède l’entreprise moins ce qu’elle doit (capitaux propres), divisé par le nombre d’actions.",""],
  [/Moat/,"Moat (avantage concurrentiel)","Le « fossé » qui protège un château, selon l’image de Buffett : ce qui empêche les concurrents de prendre les clients. Marque, coûts de changement, effets de réseau, coûts bas ou réglementation. Noté ici de 0 à 5.","Hermès (marque) : 5. Un constructeur automobile : 1."],
  [/Taux d’actualisation|^Taux/,"Taux d’actualisation","Le rendement minimum que tu exiges. Il sert à ramener l’argent futur en valeur d’aujourd’hui : 100 € dans 10 ans valent moins que 100 € maintenant. Plus il est élevé, plus la valeur calculée est prudente.","9 % est une valeur courante pour des actions."],
  [/Croissance perpétuelle/,"Croissance perpétuelle","La croissance supposée après 10 ans, indéfiniment. Elle doit rester proche de l’inflation, sinon la valeur explose artificiellement.","Entre 2 et 3 %."],
  [/Croissance/,"Croissance","L’augmentation moyenne par an des bénéfices. C’est l’hypothèse qui pèse le plus dans la valeur intrinsèque : mieux vaut être prudent.",""],
  [/valeur terminale/i,"Valeur terminale","La valeur de tous les flux après la 10e année. Si elle représente l’essentiel du résultat, le calcul dépend beaucoup d’hypothèses lointaines.",""],
  [/Prix de revient|PRU/,"Prix de revient (PRU)","Le prix moyen auquel tu as acheté tes actions, frais compris.",""],
  [/^Qualité/,"Critère qualité","Note la rentabilité (ROIC/ROE), la marge opérationnelle et la croissance des bénéfices. 35 points sur 100 dans le score.",""],
  [/^Solidité/,"Critère solidité","Note l’endettement (dette nette / EBITDA) : une entreprise peu endettée survit mieux aux crises. 15 points sur 100.",""],
  [/^Prix$/,"Critère prix","Note la marge de sécurité entre le cours et la valeur intrinsèque, ou à défaut le PER. 25 points sur 100.",""],
  [/Revente/,"Règle de revente","« À la valeur » : on vend quand le cours atteint la valeur estimée. « Jamais » : on garde, comme Buffett avec ses meilleures entreprises.",""],
  [/lignes/,"Nombre de lignes","Le nombre d’actions différentes que tu veux détenir. Plus il y en a, moins une seule mauvaise surprise pèse sur ton portefeuille. Pour un particulier, 5 à 10 lignes de poids égal est un bon compromis ; Buffett lui-même dit que la diversification protège de ce qu’on ne sait pas.","5 lignes : chaque action vise 20 % du portefeuille."],
  [/Frais/,"Frais par ordre","Ce que ton courtier facture à chaque achat. Avec de petits montants, les frais pèsent lourd : le plan regroupe donc tes achats sur peu d’actions par mois pour que les frais restent sous 1 % du montant.","1 € de frais sur un ordre de 200 € = 0,5 %."],

function addTips(root){

    if(el.closest(".row")||el.querySelector(".tipbtn")) return;

    const b=document.createElement("button"); b.type="button"; b.className="tipbtn"; b.dataset.tip=i; b.textContent="i";
    b.setAttribute("aria-label","Explication : "+GLOSS[i][1]); el.appendChild(b);
  });
}
const tipbox=document.getElementById("tipbox");
function showTip(i,from){ const g=GLOSS[i]; document.getElementById("tipTitle").textContent=g[1]; document.getElementById("tipText").textContent=g[2]; const ex=document.getElementById("tipEx"); ex.textContent=g[3]; ex.hidden=!g[3]; tipbox.hidden=false; tipbox._from=from; document.getElementById("tipClose").focus(); }
function hideTip(){ if(tipbox.hidden) return; tipbox.hidden=true; if(tipbox._from&&document.body.contains(tipbox._from)) tipbox._from.focus(); }
document.addEventListener("click",e=>{
  const b=e.target.closest(".tipbtn"); if(b){ e.preventDefault(); e.stopPropagation(); showTip(+b.dataset.tip,b); return; }

async function runAi(t){
  const s=S.stocks[t]; const out=view.querySelector("#aiOut"); const btn=view.querySelector("#aiBtn");
  btn.disabled=true; out.textContent="Analyse en cours…";
  const prompt=`Tu es un analyste value investing dans l’esprit de Warren Buffett. Analyse l’entreprise ${s.name||t} (code ${t}, secteur : ${s.sector||"inconnu"}). En français, 180 mots maximum, sans titre : 1) nature et durabilité de l’avantage concurrentiel (moat) ; 2) qualité du management et de l’allocation du capital ; 3) deux risques principaux. Termine par une ligne « Moat suggéré : X/5 ». Précise que tes informations peuvent être datées.`;
  try{
    const r=await S.sample(prompt,{modelTier:"default",onText:({text})=>{out.textContent=text;}});
    S.ai[t]=r.text; out.textContent=r.text;
  }catch(e){
    out.textContent = e&&e.code==="rate_limited" ? "Trop de demandes pour le moment. Réessaie dans quelques minutes." : e&&e.code==="not_granted" ? "Analyse non autorisée sur cette page." : "L’analyse n’a pas abouti. Réessaie plus tard.";
  }finally{btn.disabled=false;}
}

function rCalc(){
  const keys=Object.keys(S.stocks).sort(); const t=S.sel&&S.stocks[S.sel]?S.sel:keys[0];
  const s=t?S.stocks[t]:{}; S.sel=t||null;
  const base = s.fcfps ?? s.eps ?? "";
  view.innerHTML = `
  <div class="sheet">
    <label for="cpick">Action</label><select id="cpick">${keys.map(k=>`<option value="${esc(k)}" ${k===t?"selected":""}>${esc(S.stocks[k].name||k)}</option>`).join("")||"<option>Aucune action</option>"}</select>
    <p class="small muted" style="margin:8px 0 0">Méthode : actualisation des flux de trésorerie (DCF) sur 10 ans, puis valeur terminale.</p>
  </div>
  <div class="sheet">
    <div class="grid2">
      <div><label for="c_base">Flux de départ par action (€)</label><input id="c_base" inputmode="decimal" value="${esc(base)}"></div>
      <div><label for="c_price">Cours actuel (€)</label><input id="c_price" inputmode="decimal" value="${esc(s.price??"")}"></div>
      <div><label for="c_g1">Croissance années 1 à 5 (%)</label><input id="c_g1" inputmode="decimal" value="8"></div>
      <div><label for="c_g2">Croissance années 6 à 10 (%)</label><input id="c_g2" inputmode="decimal" value="5"></div>
      <div><label for="c_gt">Croissance perpétuelle (%)</label><input id="c_gt" inputmode="decimal" value="2.5"></div>
      <div><label for="c_r">Taux d’actualisation (%)</label><input id="c_r" inputmode="decimal" value="9"></div>
    </div>
    <p class="small muted" style="margin:10px 0 0">Le flux de départ est le FCF par action s’il est renseigné, sinon le BPA. Sois prudent sur la croissance : c’est l’hypothèse qui pèse le plus.</p>
  </div>
  <div class="sheet" id="cOut"></div>`;
  const ids=["c_base","c_price","c_g1","c_g2","c_gt","c_r"];
  const calc=()=>{
    const [b,p,g1,g2,gt,r]=ids.map(id=>num(view.querySelector("#"+id).value.replace(",",".")));
    const o=view.querySelector("#cOut");
    if(b==null||g1==null||g2==null||gt==null||r==null){o.innerHTML=`<p class="muted">Renseigne le flux de départ et les hypothèses.</p>`;return;}
    if(r<=gt){o.innerHTML=`<p class="neg">Le taux d’actualisation doit être supérieur à la croissance perpétuelle.</p>`;return;}
    let cf=b, pv=0; for(let y=1;y<=10;y++){cf*=1+(y<=5?g1:g2)/100; pv+=cf/Math.pow(1+r/100,y);}
    const tv=cf*(1+gt/100)/((r-gt)/100); const pvtv=tv/Math.pow(1+r/100,10); const iv=pv+pvtv;
    const mos=p?(1-p/iv)*100:null; const buy=iv*(1-MOS/100);
    const gF = s.eps>0 ? s.eps*(8.5+2*Math.min(g1,15))*4.4/Math.max(r-4,1) : null;
    o.innerHTML=`<div class="muted small">Valeur intrinsèque estimée</div><div class="big">${eur(iv)}</div>
      ${mos!=null?`<p class="${mos>=0?"pos":"neg"}" style="margin:6px 0 0;font-weight:600">${mos>=0?`Marge de sécurité : ${fmt(mos,0)} %`:`Cours ${fmt(-mos,0)} % au-dessus de la valeur`}</p>`:""}
      <dl class="kv" style="margin-top:12px">
        <dt>Prix d’achat Buffett (marge ${MOS} %)</dt><dd>${eur(buy)}</dd>
        <dt>Part de la valeur terminale</dt><dd>${fmt(pvtv/iv*100,0)} %</dd>
        <dt>Formule de Graham (indicative)</dt><dd>${eur(gF)}</dd>
      </dl>
      ${pvtv/iv>0.75?`<p class="small muted">Plus de 75 % de la valeur vient de la valeur terminale : le résultat est très sensible aux hypothèses.</p>`:""}
      ${t?`<div class="actions"><button class="btn" id="saveIv">Enregistrer ${eur(iv)} comme valeur intrinsèque</button></div>`:""}`;
    addTips(o); const sv=o.querySelector("#saveIv"); if(sv) sv.addEventListener("click",async()=>{ await saveStock(t,{...S.stocks[t],intrinsic:Math.round(iv*100)/100}); toast("Valeur intrinsèque enregistrée."); });
  };
  ids.forEach(id=>view.querySelector("#"+id).addEventListener("input",calc));
  view.querySelector("#cpick").addEventListener("change",e=>{S.sel=e.target.value;render();});
  calc();
}

function rPortfolio(){
  const rows=Object.entries(S.positions).map(([t,p])=>({t,...p,s:S.stocks[t]||{}}));
  const held=rows.filter(r=>r.status==="held"&&r.qty>0), watch=rows.filter(r=>r.status!=="held"||!(r.qty>0));
  let val=0,cost=0; held.forEach(r=>{ if(r.s.price){val+=r.qty*r.s.price;} if(r.pru){cost+=r.qty*r.pru;} });
  const pl=val-cost;
  view.innerHTML=`
  ${planHtml()}
  ${held.length?`<div class="sheet"><div class="muted small">Valeur du portefeuille</div><div class="big">${eur(val)}</div>
    ${cost?`<p class="${pl>=0?"pos":"neg"}" style="margin:6px 0 0;font-weight:600">${pl>=0?"+":""}${eur(pl)} (${fmt(pl/cost*100)} %)</p>`:""}${(()=>{ const n=held.filter(r=>{const a=sellAlert(r.t);return a&&a.k!=="keep";}).length; return `<p class="small" style="margin:6px 0 0">${n?`${n} alerte${n>1?"s":""} de vente à examiner ci-dessous.`:"Aucune alerte de vente : on garde."}</p>`; })()}</div>`:""}
  <h2>Positions</h2>
  <div class="list">${held.length?held.map(posHtml).join(""):`<div class="empty">Aucune position. Passe une action suivie en « détenue » pour la voir ici.</div>`}</div>

function heldValue(t){ const p=S.positions[t], s=S.stocks[t]; return p&&p.status==="held"&&p.qty>0&&s&&s.price? p.qty*s.price : 0; }
function planCalc(){
  const P=S.plan, all=stocksArr();
  const cands=all.filter(s=>signalOf(s).k==="buy"&&s.price>0).sort((a,b)=>b._d.mos-a._d.mos).slice(0,Math.max(1,P.lines|0));
  const near=all.filter(s=>signalOf(s).k==="wait").sort((a,b)=>b._d.mos-a._d.mos).slice(0,3);
  if(!cands.length||!(P.amount>0)) return {cands,near,orders:[],left:P.amount||0};
  const total=cands.reduce((a,s)=>a+heldValue(s.t),0)+P.amount, target=total/cands.length;
  const gaps=cands.map(s=>({s,held:heldValue(s.t),gap:target-heldValue(s.t)})).sort((a,b)=>b.gap-a.gap);
  const minOrder=Math.max(50,(P.fee||0)/0.01);
  const n=clamp(Math.floor(P.amount/minOrder),1,cands.length);
  let pick=gaps.slice(0,n).filter(g=>g.gap>0); if(!pick.length) pick=[gaps[0]];
  const gsum=pick.reduce((a,g)=>a+Math.max(g.gap,1),0);
  let left=P.amount; const orders=pick.map(g=>{ const alloc=P.amount*Math.max(g.gap,1)/gsum; const q=P.frac? Math.floor(alloc/g.s.price*1000)/1000 : Math.floor(alloc/g.s.price); left-=q*g.s.price; return {s:g.s,held:g.held,alloc,qty:q}; });
  if(!P.frac){ while(true){ const c=orders.filter(o=>left>=o.s.price).sort((a,b)=>(a.qty*a.s.price+a.held)-(b.qty*b.s.price+b.held))[0]; if(!c) break; c.qty++; left-=c.s.price; } }
  return {cands,near,orders,left,target,total};
}

/* ---------- Simulateur historique ---------- */
function backtest(rowsIn,P){
  const rows=[...rowsIn].filter(r=>r.y!=null&&r.price>0).sort((a,b)=>a.y-b.y);
  if(rows.length<5) return null;
  const i0=3, start=10000;
  let cash=start, sh=0, trades=0, yearsIn=0;
  let bhSh=start/rows[i0].price, bhCash=0;
  const out=[];
  for(let i=i0;i<rows.length;i++){
    const r=rows[i];
    const last3=rows.slice(i-2,i+1).map(x=>x.eps).filter(x=>x>0);
    const base=last3.length?last3.reduce((a,b)=>a+b,0)/last3.length:null;
    const k=Math.min(5,i); const e0=rows[i-k].eps, e1=r.eps;
    const g = e0>0&&e1>0 ? clamp((Math.pow(e1/e0,1/k)-1)*100,0,12) : 0;
    const iv=dcf(base,g,g/2,GT,P.r);
    if(i>i0){ if(sh>0){cash+=sh*(r.dps||0); yearsIn++;} bhCash+=bhSh*(r.dps||0); }
    let act="";
    if(iv){
      if(sh===0 && r.price<=iv*(1-P.mos/100)){ sh=cash/r.price; cash=0; trades++; act="Achat"; }
      else if(sh>0 && P.sell==="value" && r.price>=iv){ cash=sh*r.price; sh=0; act="Vente"; }
    }
    out.push({y:r.y,price:r.price,iv,g,act,held:sh>0,val:cash+sh*r.price,bh:bhSh*r.price+bhCash});
  }
  const n=rows[rows.length-1].y-rows[i0].y;
  const last=out[out.length-1];
  const cagr=v=> n>0? (Math.pow(v/start,1/n)-1)*100 : null;
  return {out,n,start,trades,yearsIn,final:last.val,bhFinal:last.bh,cagr:cagr(last.val),bhCagr:cagr(last.bh),y0:rows[i0].y};
}
function chartSvg(out){
  const W=340,H=150,p=8; const vals=out.flatMap(o=>[o.val,o.bh]); const mx=Math.max(...vals)*1.05, mn=0;
  const x=i=>p+(W-2*p)*(out.length>1?i/(out.length-1):0), y=v=>H-p-(H-2*p)*(v-mn)/(mx-mn||1);
  const line=k=>out.map((o,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(o[k]).toFixed(1)}`).join("");
  const dots=out.map((o,i)=>o.act?`<circle cx="${x(i).toFixed(1)}" cy="${y(o.val).toFixed(1)}" r="4" fill="${o.act==="Achat"?"var(--green)":"var(--red)"}"/>`:"").join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de 10 000 € : stratégie contre achat-conservation">
    <line x1="${p}" x2="${W-p}" y1="${y(10000)}" y2="${y(10000)}" stroke="var(--rule)" stroke-dasharray="3 3"/>
    <path d="${line("bh")}" fill="none" stroke="var(--muted)" stroke-width="2"/>
    <path d="${line("val")}" fill="none" stroke="var(--green)" stroke-width="2.5"/>${dots}</svg>
    <div class="legend"><span><i style="background:var(--green)"></i>Méthode Buffett</span><span><i style="background:var(--muted)"></i>Achat dès le départ</span></div>`;
}

function sellAlert(t){
  const p=S.positions[t], s=S.stocks[t]; if(!p||p.status!=="held"||!s) return null;
  const th=p.thesis||{}, R=[]; const r=s.roic??s.roe, r0=th.roic??th.roe;
  if(s.moat!=null && (s.moat<4 || (th.moat!=null && s.moat<th.moat))) R.push(`moat à ${fmt(s.moat)}/5${th.moat!=null&&th.moat!==s.moat?` (contre ${fmt(th.moat)}/5 à l’achat)`:""}`);
  if(r!=null && (r<15 || (r0!=null && r<=r0-5))) R.push(`rentabilité ${fmt(r)} %${r0!=null&&r0!==r?` (contre ${fmt(r0)} %)`:""}`);
  if(s.opMargin!=null && th.opMargin!=null && s.opMargin<=th.opMargin-5) R.push(`marge ${fmt(s.opMargin)} % (contre ${fmt(th.opMargin)} %)`);
  if(s.netDebtEbitda!=null && (s.netDebtEbitda>2.5 || (th.netDebtEbitda!=null && s.netDebtEbitda>=th.netDebtEbitda+1))) R.push(`dette ${fmt(s.netDebtEbitda)}× l’EBITDA`);
  if(s.eps!=null && th.eps>0 && s.eps<=th.eps*0.75) R.push(`BPA en baisse de ${fmt((1-s.eps/th.eps)*100,0)} %`);
  if(R.length) return {k:"review",l:"Thèse à revoir",reasons:R};
  const d=derived(s); if(d.mos!=null && d.mos<=-50) return {k:"over",l:"Très surévaluée",reasons:[`cours ${fmt(-d.mos,0)} % au-dessus de la valeur intrinsèque`]};
  return {k:"keep",l:"Conserver",reasons:[]};
}
async function savePos(t,o){ if(!S.db){toast("Enregistrement impossible sans connexion.");return;} if(o.status==="held"&&!o.thesis&&S.stocks[t]){ const s=S.stocks[t]; o={...o,thesis:{roe:s.roe??null,roic:s.roic??null,opMargin:s.opMargin??null,netDebtEbitda:s.netDebtEbitda??null,moat:s.moat??null,eps:s.eps??null,at:new Date().toISOString().slice(0,10)}}; } S.positions[t]=o; render(); try{await S.db.doc("positions/"+t).set(o);}catch(e){toast("Échec de l’enregistrement.");} }
async function delPos(t){ if(!S.db)return; delete S.positions[t]; render(); try{await S.db.doc("positions/"+t).delete();}catch(e){toast("Échec de la suppression.");} }

document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{S.tab=b.dataset.tab;render();window.scrollTo(0,0);}));
render();

(async()=>{
  const db = window.claude ? await window.claude.use("db") : null;
  if(!db){ updStatus(); return; }
  S.db=db; updStatus();
  db.collection("stocks").onSnapshot(q=>{ const o={}; q.docs.forEach(d=>o[d.id]=d.data()); S.stocks=o; updStatus(); if(!document.activeElement||!view.contains(document.activeElement)||S.tab==="screener"&&document.activeElement.tagName!=="INPUT") render(); }, ()=>toast("Connexion aux données interrompue. Recharge la page."));
  db.collection("history").onSnapshot(q=>{ const o={}; q.docs.forEach(d=>o[d.id]=d.data()); S.history=o; if(S.tab==="sim"&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) render(); }, ()=>{});
  db.doc("settings/plan").onSnapshot(d=>{ if(d.exists){ S.plan={...S.plan,...d.data()}; if(S.tab==="portfolio"&&!(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName))) render(); } }, ()=>{});
  db.doc("requests/latest").onSnapshot(d=>{ S.req=d.exists?d.data():null; if(S.tab==="screener"&&!(document.activeElement&&document.activeElement.tagName==="INPUT")) render(); }, ()=>{});
  db.collection("positions").onSnapshot(q=>{ const o={}; q.docs.forEach(d=>o[d.id]=d.data()); S.positions=o; if(S.tab==="portfolio"&&!(document.activeElement&&document.activeElement.tagName==="INPUT")) render(); }, ()=>{});
})();
(async()=>{ const sm = window.claude ? await window.claude.use("sample") : null; if(sm){ S.sample=sm; if(S.tab==="fiche") render(); } })();
</script>
